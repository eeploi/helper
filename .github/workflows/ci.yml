name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: command -v shellcheck || (sudo apt-get update && sudo apt-get install -y shellcheck)
      - name: shellcheck
        run: shellcheck eeploi-helper tests/run.sh
      - name: bash -n
        run: bash -n eeploi-helper && bash -n tests/run.sh
      - name: Tests
        run: bash tests/run.sh
