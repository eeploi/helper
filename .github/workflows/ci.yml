name: CI

# Once per pull request; on main too, since bin/release needs a green run on the released commit.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push on a pull request cancels its older run. Each run on main gets its own group,
# so none is cancelled or dropped while it waits: bin/release needs every commit's result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install shellcheck
        run: command -v shellcheck || (sudo apt-get update && sudo apt-get install -y shellcheck)
      - name: Install minisign
        run: command -v minisign || (sudo apt-get update && sudo apt-get install -y minisign)
      - name: shellcheck
        run: shellcheck eeploi-helper tests/run.sh bin/release
      - name: bash -n
        run: bash -n eeploi-helper && bash -n tests/run.sh && bash -n bin/release
      - name: Tests
        run: bash tests/run.sh
